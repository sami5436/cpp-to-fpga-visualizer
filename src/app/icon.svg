<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="trace" gradientUnits="userSpaceOnUse" x1="8" y1="25" x2="24" y2="11">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.38" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- die -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7" fill="#05070d" stroke="#2b3a50" stroke-width="1.5"/>

  <!-- Manhattan-routed net, FETCH -> ACC across the four stage colours -->
  <path d="M8 25 V18 H16 V11 H24" fill="none" stroke="url(#trace)"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- source and sink pads -->
  <rect x="5.5" y="22.5" width="5" height="5" rx="1.2" fill="#22d3ee"/>
  <rect x="21.5" y="8.5" width="5" height="5" rx="1.2" fill="#34d399"/>
</svg>
